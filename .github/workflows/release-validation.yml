name: Release validation

# Validates a release candidate: package, SBOM, clean installation and build
# provenance. It never publishes to npm or creates a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: npm test
      - name: Package
        run: mkdir -p dist && npm pack --pack-destination dist
      - name: Software Bill of Materials (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > dist/era-agent.cdx.json
      - name: Clean-environment installation test
        run: bash scripts/clean-install-test.sh dist/era-agent-*.tgz
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/era-agent-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/
