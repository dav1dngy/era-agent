name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, secrets and dependency validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: ESLint
        run: npm run lint
      - name: Syntax check and secret scan
        run: node scripts/check.mjs
      - name: Dependency tree matches the lockfile
        run: npm ls --omit=dev
      - name: Registry signatures and provenance of dependencies
        run: npm audit signatures
      - name: Known vulnerabilities (high and critical block)
        run: npm audit --omit=dev --audit-level=high

  unit-linux:
    name: Unit and fake-engine tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: npm test
        env:
          ERA_SKIP_REA: '1'

  rea-compatibility-macos:
    name: REA compatibility and integration (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - name: REA engine status
        run: node bin/era.mjs status
      - name: Tests (real REA, MCP, sandbox; CI has no native decompiler)
        run: npm test
      - name: REA smoke test (JavaScript application)
        run: node bin/era.mjs analyze benchmarks/datasets/js-app --json > js.json && node -e "const a=require('./js.json'); if(a.status!=='succeeded'||!a.facts.includes('import:src/main.js->src/net.js')) process.exit(1)"
      - name: REA smoke test (Mach-O)
        run: node bin/era.mjs analyze benchmarks/datasets/native-hello/hello --no-decompile --json > macho.json && node -e "const a=require('./macho.json'); if(!a.facts.includes('export:_greet')) process.exit(1)"
      - name: Self-improvement is refused in CI
        run: |
          if node bin/era.mjs improve propose; then echo "improve must refuse in CI"; exit 1; fi

  studio-desktop-macos:
    name: 'ERA Studio desktop (macOS): dependencies, renderer tests, Electron scenarios, package and packaged smoke'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/studio/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/studio
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - name: Studio dependency tree matches its lockfile
        run: npm ls --omit=dev --prefix apps/studio
      - name: Studio registry signatures
        run: npm audit signatures --prefix apps/studio
      - name: 'Studio known vulnerabilities (high and critical block; the documented low DOMPurify entries are tracked in docs/ERA_V020_REMEDIATION.md)'
        run: npm audit --omit=dev --audit-level=high --prefix apps/studio
      - name: Studio renderer and dependency tests must run, not skip
        run: |
          node --test tests/studio-dependencies.test.js tests/studio-ui-model.test.js tests/studio-rebuild-model.test.js tests/screenshot-rebuild.test.js tests/control-plane-system.test.js tests/control-plane-jobs.test.js tests/audit-control-plane.test.js tests/audit-remediation.test.js | tee studio-tests.log
          grep -E '^ℹ fail 0$' studio-tests.log
          grep -E '^ℹ skipped 0$' studio-tests.log
      - name: Electron desktop scenarios
        run: npm run test:desktop --prefix apps/studio
      - name: Build the unsigned desktop application
        run: npm run package --prefix apps/studio
      - name: Packaged application smoke test
        run: npm run test:package --prefix apps/studio

